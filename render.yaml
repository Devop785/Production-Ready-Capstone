# Free plan: SQLite lives on the ephemeral filesystem and resets on each
# deploy and on sleep/wake. Switch to plan: starter and reattach a disk at
# /var/data (with DB_PATH=/var/data/internships.sqlite) for durable storage.
services:
  - type: web
    name: skillorbit-capstone
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run seed && npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: data/internships.sqlite
